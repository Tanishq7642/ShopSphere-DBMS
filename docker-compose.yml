# ============================================================================
# ShopSphere-DBMS · docker-compose
# ----------------------------------------------------------------------------
#   docker compose up -d db     → PostgreSQL 17, schema + dataset auto-loaded
#   docker compose up --build app → Next.js dashboard on http://localhost:3000
# ============================================================================

services:
  db:
    image: postgres:17-alpine
    container_name: shopsphere-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce_db
    ports:
      - "5432:5432"
    volumes:
      - shopsphere_pgdata:/var/lib/postgresql/data
      # initdb runs .sql files in alphabetical order on first boot
      - ./sql/00_schema.sql:/docker-entrypoint-initdb.d/00_schema.sql:ro
      - ./sql/01_functions.sql:/docker-entrypoint-initdb.d/01_functions.sql:ro
      - ./sql/02_procedures.sql:/docker-entrypoint-initdb.d/02_procedures.sql:ro
      - ./sql/03_triggers.sql:/docker-entrypoint-initdb.d/03_triggers.sql:ro
      - ./sql/04_views.sql:/docker-entrypoint-initdb.d/04_views.sql:ro
      - ./sql/05_analytics.sql:/docker-entrypoint-initdb.d/05_analytics.sql:ro
      - ./sql/06_load_data.sql:/docker-entrypoint-initdb.d/06_load_data.sql:ro
      - ./data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopsphere-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ecommerce_db
    ports:
      - "3000:3000"

volumes:
  shopsphere_pgdata:
